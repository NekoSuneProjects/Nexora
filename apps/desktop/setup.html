<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexora Desktop Setup</title><style>body{font:16px system-ui;background:#111827;color:#e5e7eb;max-width:650px;margin:10vh auto;padding:30px}input,button{font:inherit;padding:12px;border-radius:8px}input{width:95%;margin:12px 0;background:#1f2937;border:1px solid #64748b;color:white}button{background:#78dfb7;border:0;cursor:pointer}p{line-height:1.6}#error{color:#fca5a5}</style>
<h1>Nexora Desktop</h1><p>Connect to your Nexora web frontend. You can leave the URL undecided until you launch the desktop app. For remote access, use HTTPS. HTTP is allowed for localhost testing only.</p>
<form id="form"><label>Frontend URL<input id="url" type="url" placeholder="https://chat.example.com" required autofocus></label><button type="submit">Connect</button></form><p id="error" role="alert"></p>
<script>document.querySelector("#form").addEventListener("submit",async e=>{e.preventDefault();try{await window.nexoraDesktop.configure(document.querySelector("#url").value)}catch(error){document.querySelector("#error").textContent=error.message}})</script></html>
