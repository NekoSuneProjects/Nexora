name: Manual API and Web Docker Images
on:
  workflow_dispatch:
    inputs:
      build_target:
        description: "Docker image(s) to build"
        required: true
        type: choice
        default: both
        options:
          - both
          - api
          - web
      publish_ghcr:
        description: "Push multi-platform images to GitHub Container Registry"
        type: boolean
        required: true
        default: true
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            dockerfile: Dockerfile
          - component: web
            dockerfile: Dockerfile.web
    if: ${{ inputs.build_target == 'both' || inputs.build_target == matrix.component }}
    steps:
      - uses: actions/checkout@v4
      - name: Normalize GHCR image name
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.component }}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=dev-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        if: ${{ inputs.publish_ghcr }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and optionally publish multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.publish_ghcr }}
          tags: |
            ${{ steps.image.outputs.name }}:manual
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.sha_tag }}
      - name: Export downloadable amd64 image
        shell: bash
        run: |
          docker buildx build --platform linux/amd64 -f "${{ matrix.dockerfile }}" --load -t "nexora-${{ matrix.component }}:manual" .
          docker save "nexora-${{ matrix.component }}:manual" | gzip > "nexora-${{ matrix.component }}-amd64.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: nexora-${{ matrix.component }}-docker-amd64
          path: nexora-${{ matrix.component }}-amd64.tar.gz
          retention-days: 7
