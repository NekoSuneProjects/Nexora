name: Nexora CI
on:
  pull_request:
  push:
    branches: [main, feat/initial-platform-foundation]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: node --check apps/web/app.js
