services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: nexora
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora -d nexora"]
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    build: .
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgres://nexora:${POSTGRES_PASSWORD}@postgres:5432/nexora
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
volumes:
  postgres_data:
